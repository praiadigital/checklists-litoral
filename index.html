<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checklists Litoral — mudança e primeira temporada | Praia Digital</title><meta name="description" content="Checklists práticos: mudança para o litoral e primeira temporada do seu imóvel."><link rel="canonical" href="https://praia.digital/checklists-litoral/"><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f8fafc;color:#0f172a;line-height:1.6}.hero{background:linear-gradient(135deg,#0c4a6e,#0ea5e9);color:#fff;padding:60px 20px;text-align:center}.container{max-width:720px;margin:auto;padding:30px 20px}.card{background:#fff;border-radius:13px;padding:24px;margin-bottom:16px;box-shadow:0 3px 10px #0001}label{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9;cursor:pointer}input[type=checkbox]{width:20px;height:20px;accent-color:#0ea5e9}.done span{text-decoration:line-through;color:#94a3b8}h3{margin:18px 0 6px;color:#0c4a6e}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;padding:10px;border:2px solid #0ea5e9;background:#fff;color:#0c4a6e;border-radius:10px;font-weight:700;cursor:pointer}.tab.on{background:#0ea5e9;color:#fff}.prog{height:12px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-bottom:14px}.prog>div{height:100%;background:#16a34a;transition:width .4s}a.app{color:#0c4a6e;font-weight:600}footer{text-align:center;padding:24px;color:#64748b}</style></head><body><header class="hero"><h1>📋 Checklists Litoral</h1><p>Mudança para a praia ou primeira temporada: escolha sua missão.</p></header><main class="container"><div class="card"><div class="tabs"><button class="tab on" id="t0" onclick="show(0)">🏠 Mudança</button><button class="tab" id="t1" onclick="show(1)">🏖️ 1ª Temporada</button></div><div class="prog"><div id="bar" style="width:0%"></div></div><div id="list"></div></div><div class="card"><strong>Continue a jornada:</strong><br>✅ <a class="app" href="https://praia.digital/checklist-anfitriao/">Checklist do Anfitrião</a> — operação completa<br>🤖 <a class="app" href="https://praia.digital/concierge-ia/">Concierge IA</a> — mensagens prontas<br>🔍 <a class="app" href="https://praia.digital/checklists/">Vistoria de Compra</a> — antes de fechar negócio</div></main><footer><a class="app" href="https://praia.digital/apps/">🌐 Apps Praia Digital</a> · <a class="app" href="https://praia.digital/">praia.digital</a></footer><script>var dados=[{'📦 Antes da mudança':['Transferir água, luz e internet','Pintura e reparos feitos (mais fácil vazio)','Anti-mofo: desumidificador ou giz nas gavetas','Seguro residencial contra maresia'],'🚚 Dia da mudança':['Fotos do imóvel vazio (estado inicial)','Leitura de medidores registrada','Caixas por cômodo identificadas','Kit primeira noite: roupa de cama e café'],'🏡 Primeira semana':['Conhecer vizinhos e síndico','Farmácia, mercado e UPA mais próximos','Cadastro na prefeitura (IPTU)','Testar o trajeto nos horários de pico']},{'📝 Anúncio':['Cadastro Airbnb/Booking completo','20+ fotos profissionais','Precificação por temporada ativa','Resposta automática configurada'],'🧼 Casa pronta':['Enxoval: 2 jogos por cama','Kit cozinha completo','Wi-Fi com senha visível','Itens de praia disponíveis'],'🤝 Operação':['Faxineira de confiança contratada','Manual da casa impresso','Contato de emergência definido','Primeira reserva celebrada! 🎉']}];var cur=0;var st=JSON.parse(localStorage.getItem('cl-litoral')||'{}');function show(i){cur=i;document.getElementById('t0').className='tab'+(i===0?' on':'');document.getElementById('t1').className='tab'+(i===1?' on':'');render();}function render(){var d=dados[cur];var html='';Object.keys(d).forEach(function(cat){html+='<h3>'+cat+'</h3>';d[cat].forEach(function(it){var k=cur+cat+it;html+='<label class="'+(st[k]?'done':'')+'"><input type="checkbox" '+(st[k]?'checked':'')+' onchange="tgl(this,\''+k.replace(/'/g,'')+'\')"><span>'+it+'</span></label>';});});document.getElementById('list').innerHTML=html;upd();}function tgl(el,k){st[k]=el.checked;localStorage.setItem('cl-litoral',JSON.stringify(st));el.parentElement.classList.toggle('done',el.checked);upd();}function upd(){var d=dados[cur],total=0,done=0;Object.keys(d).forEach(function(c){d[c].forEach(function(it){total++;if(st[cur+c+it])done++;});});document.getElementById('bar').style.width=Math.round(done/total*100)+'%';}render();</script></body></html>
