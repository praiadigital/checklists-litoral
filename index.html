<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checklists de Compra — primeiro imóvel no litoral | Praia Digital</title><meta name="description" content="Checklist interativo para comprar o primeiro imóvel no litoral de SP com segurança. Progresso salvo."><link rel="canonical" href="https://praia.digital/checklists-litoral/"><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f8fafc;color:#0f172a;line-height:1.6}.hero{background:linear-gradient(135deg,#0c4a6e,#0ea5e9);color:#fff;padding:60px 20px;text-align:center}.container{max-width:720px;margin:auto;padding:30px 20px}.card{background:#fff;border-radius:13px;padding:24px;margin-bottom:16px;box-shadow:0 3px 10px #0001}label{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9;cursor:pointer}input[type=checkbox]{width:20px;height:20px;accent-color:#0ea5e9}.done span{text-decoration:line-through;color:#94a3b8}h3{margin:18px 0 6px;color:#0c4a6e}.prog{height:12px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-bottom:14px}.prog>div{height:100%;background:#16a34a;transition:width .4s}a.app{color:#0c4a6e;font-weight:600}footer{text-align:center;padding:24px;color:#64748b}</style></head><body><header class="hero"><h1>📋 Checklist de Compra</h1><p>Da pesquisa ao registro: compre seu imóvel no litoral sem sustos.</p></header><main class="container"><div class="card"><div class="prog"><div id="bar" style="width:0%"></div></div><div id="list"></div></div><div class="card"><strong>Ferramentas da jornada:</strong><br>🏖️ <a class="app" href="https://praia.digital/guia-comprador/">Guia do Comprador</a> — o passo a passo completo<br>🧾 <a class="app" href="https://praia.digital/calculadora-custos/">Calculadora de Custos</a> — some ITBI e cartório<br>🏦 <a class="app" href="https://praia.digital/simulador-credito/">Simulador de Crédito</a> — financiamento</div></main><footer><a class="app" href="https://praia.digital/apps/">🌐 Apps Praia Digital</a> · <a class="app" href="https://praia.digital/">praia.digital</a></footer><script>var itens={'🔍 Pesquisa':['Definir objetivo (morar/temporada/investir)','Comparar cidades no Radar de Preços','Visitar na alta E na baixa temporada','Verificar distância real da praia e serviços'],'📄 Documentação':['Matrícula atualizada do imóvel','Certidões negativas do vendedor','IPTU quitado','Débitos de condomínio zerados','Habite-se/averbação de obra'],'💰 Financeiro':['Simular financiamento (FGTS/SBPE)','Somar ITBI + cartório + corretagem','Reserva de emergência pós-compra','Proposta por escrito'],'✍️ Fechamento':['Contrato de compra e venda revisado','Escritura lavrada em cartório','Registro no cartório de imóveis','Troca de titularidade (água/luz/condomínio)']};var st=JSON.parse(localStorage.getItem('checkcompra')||'{}');var html='';Object.keys(itens).forEach(function(cat){html+='<h3>'+cat+'</h3>';itens[cat].forEach(function(it){var k=cat+it;html+='<label class="'+(st[k]?'done':'')+'"><input type="checkbox" '+(st[k]?'checked':'')+' onchange="tgl(this,\''+k.replace(/'/g,'')+'\')"><span>'+it+'</span></label>';});});document.getElementById('list').innerHTML=html;upd();function tgl(el,k){st[k]=el.checked;localStorage.setItem('checkcompra',JSON.stringify(st));el.parentElement.classList.toggle('done',el.checked);upd();}function upd(){var total=0,done=0;Object.keys(itens).forEach(function(c){itens[c].forEach(function(i){total++;if(st[c+i])done++;})});document.getElementById('bar').style.width=Math.round(done/total*100)+'%';}</script></body></html>
