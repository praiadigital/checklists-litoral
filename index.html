<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklists do Litoral — compre seu imóvel com segurança</title>
<meta name="description" content="Checklist interativo para comprar imóvel no litoral sem surpresas. Progresso salvo no navegador. Satélite da rede praia.digital">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(180deg,#fef3c7,#fff);color:#3f3f46;min-height:100vh}
header{padding:24px;text-align:center;background:linear-gradient(120deg,#d97706,#f59e0b);color:#fff}
nav a{color:#fff;margin:0 8px;text-decoration:none;font-size:14px;font-weight:600}
.wrap{max-width:700px;margin:auto;padding:24px}
.barra{background:#fde68a;border-radius:99px;height:22px;overflow:hidden;margin-bottom:8px}
.barra div{height:100%;background:linear-gradient(90deg,#f59e0b,#10b981);width:0;transition:width .4s}
#pct{text-align:center;font-weight:700;margin-bottom:20px}
.fase{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.fase h2{font-size:18px;color:#b45309}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #fde68a;cursor:pointer}
.item input{margin-top:4px;transform:scale(1.4);accent-color:#10b981}
.item.done span{text-decoration:line-through;color:#a1a1aa}
footer{padding:20px;text-align:center;font-size:13px}
footer a{color:#d97706}
button.reset{background:#fef3c7;border:1px solid #f59e0b;border-radius:99px;padding:8px 18px;cursor:pointer;display:block;margin:0 auto 20px}
</style></head>
<body>
<header><h1>✅ Checklists do Litoral</h1><p>O passo a passo definitivo para comprar seu imóvel na praia</p>
<nav><a href="https://praia.digital">Praia Digital</a><a href="https://praia.digital/guia-comprador">Guia do Comprador</a><a href="https://praia.digital/calculadora-custos">Calc. Custos</a><a href="https://praia.digital/apps">Todos os apps</a></nav></header>
<div class="wrap">
<div class="barra"><div id="fill"></div></div><p id="pct">0% concluído</p>
<div id="list"></div>
<button class="reset" onclick="reset()">↺ Recomeçar checklist</button>
</div>
<footer>Rede <a href="https://praia.digital">praia.digital</a> · <a href="https://praia.digital/checklists">Checklists Pro</a> · <a href="https://praia.digital/plano-litoral">Plano Litoral</a> · <a href="https://praia.digital/mapa-inteligente">Mapa Inteligente</a></footer>
<script>
const fases=[
['💰 Preparação financeira',['Defina o orçamento total (imóvel + 6% de custos)','Simule o crédito e a carta de crédito FGTS','Separe a documentação de renda (holerites, IR)','Monte a reserva para entrada de 20%']],
['🔍 Escolha do imóvel',['Visite o bairro em dia de semana e de temporada','Verifique distância real da praia e ventilação','Pesquise o preço/m² no Radar de Preços','Confira histórico de alagamentos e maresia']],
['📄 Documentação',['Peça a matrícula atualizada do imóvel','Verifique certidões do vendedor (federal, estadual, trabalhista)','Cheque IPTU e condomínio em dia','Confirme se há averbação de construção/ampliação']],
['🤝 Negociação e fechamento',['Faça proposta por escrito com contraproposta','Contrate despachante ou advogado para o contrato','Pague ITBI e agende o registro em cartório','Registre a escritura no Cartório de Imóveis']],
['🏖️ Pós-compra',['Transfira contas de água, luz e condomínio','Faça vistoria fotográfica completa','Planeje mobília e enxoval para temporada','Anuncie no Airbnb com descrição do Gerador IA']]];
const KEY='checklitoral';let st=JSON.parse(localStorage.getItem(KEY)||'{}');
function render(){let tot=0,done=0;
list.innerHTML=fases.map((f,fi)=>`<div class="fase"><h2>${f[0]}</h2>${f[1].map((it,ii)=>{tot++;const k=fi+'-'+ii;if(st[k])done++;return `<label class="item ${st[k]?'done':''}"><input type="checkbox" ${st[k]?'checked':''} onchange="tgl('${k}',this)"><span>${it}</span></label>`}).join('')}</div>`).join('');
const p=Math.round(done/tot*100);fill.style.width=p+'%';pct.textContent=p+'% concluído'+(p===100?' 🎉 Parabéns, compra segura!':'');}
function tgl(k,el){st[k]=el.checked;localStorage.setItem(KEY,JSON.stringify(st));render();}
function reset(){st={};localStorage.removeItem(KEY);render();}
render();
</script></body></html>
